# Render Blueprint: 백엔드(FastAPI) + PostgreSQL
services:
  - type: web
    name: meeting-mate-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # 스케줄러 중복 실행을 피하려면 워커 1개 권장 (여러 개여도 DB 선점으로 중복 발송은 방지됨)
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: meeting-mate-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_EMAILS
        sync: false
databases:
  - name: meeting-mate-db
    plan: free
